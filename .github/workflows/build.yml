name: Build APK

on:
  push:
    branches: [main, "claude/**", native-band-pointer-preview]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # GitHub Ubuntu runners already include command-line SDK tools.
      # setup-android@v3 currently tries to install the removed SDK "tools" package.
      - name: Install Android 35 SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1); fi
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Install native band toolchain (preview only)
        if: github.ref == 'refs/heads/native-band-pointer-preview'
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1); fi
          "$SDKMGR" --install "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@stable
        if: github.ref == 'refs/heads/native-band-pointer-preview'
        with:
          targets: aarch64-linux-android
      - name: Build native Meta Neural Band protocol engine
        if: github.ref == 'refs/heads/native-band-pointer-preview'
        run: |
          bash scripts/sync-lumen.sh
          cargo install cargo-ndk --locked
          export ANDROID_NDK_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}/ndk/27.2.12479018"
          bash third_party/lumen/build-rust.sh
      - uses: gradle/actions/setup-gradle@v4
      # Permanent signing key from repo secrets (see README). Forks/PRs without secrets use the debug key.
      - name: Load signing key
        env:
          KEYSTORE_B64: ${{ secrets.HB_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/handbridge.jks"
            echo "HB_KEYSTORE=$RUNNER_TEMP/handbridge.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::HB_KEYSTORE_BASE64 secret not set; APK is debug-signed and won't install over a previous build."
          fi
      - run: chmod +x ./gradlew && ./gradlew --no-daemon --stacktrace assembleRelease
        env:
          HB_STORE_PASSWORD: ${{ secrets.HB_STORE_PASSWORD }}
          HB_KEY_ALIAS: ${{ secrets.HB_KEY_ALIAS }}
          HB_KEY_PASSWORD: ${{ secrets.HB_KEY_PASSWORD }}
      - run: cp app/build/outputs/apk/release/app-release.apk HandBridge.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HandBridge-native-preview-apk
          path: HandBridge.apk
      # Rolling pre-release so the APK can be downloaded straight onto the phone.
      - name: Publish rolling "latest" release
        if: github.event_name != 'pull_request' && github.ref != 'refs/heads/native-band-pointer-preview'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest APK
          prerelease: true
          files: HandBridge.apk
          body: Auto-built from the latest push. Install HandBridge.apk on your Android phone (allow "install unknown apps").
