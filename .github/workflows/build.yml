name: Build APK

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # GitHub Ubuntu runners already include command-line SDK tools.
      # setup-android@v3 currently tries to install the removed SDK "tools" package.
      - name: Install Android 35 SDK packages
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMGR="$SDK_ROOT/cmdline-tools/16.0/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then SDKMGR=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1); fi
          "$SDKMGR" --install "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew && ./gradlew --no-daemon --stacktrace assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk HandBridge.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HandBridge-apk
          path: HandBridge.apk
      # Rolling pre-release so the APK can be downloaded straight onto the phone.
      - name: Publish rolling "latest" release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Latest APK
          prerelease: true
          files: HandBridge.apk
          body: Auto-built from the latest push. Install HandBridge.apk on your Android phone (allow "install unknown apps").
